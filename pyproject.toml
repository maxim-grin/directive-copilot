[project]
name = "directive-copilot"
# CI's `image` job checks that a `v*` tag matches this version.
version = "0.1.0"
description = "RAG + human-in-the-loop Q&A over AER directives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest-socket>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The default run is the unit suite. `-m integration` or `-m eval` on the
# command line replaces this -m, since pytest keeps the last one.
# --allow-hosts blocks every connection that isn't loopback: unit and
# integration tests must never reach the network (a local Postgres is fine).
# `make eval` lifts it, because evals call real models.
addopts = [
    "--strict-markers",
    "-m", "not integration and not eval",
    "--allow-hosts=127.0.0.1,::1",
]
# Unmarked tests are unit tests: fake LLM, fake judge, no DB.
markers = [
    "integration: needs Postgres + pgvector (DATABASE_URL); runs in CI",
    "eval: runs the eval set against real models; costs money, run on demand",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
# Code blocks in the README are illustrative, not source.
exclude = ["*.md"]

[tool.ruff.lint]
# D101-D103: every public class, method and function has a docstring.
# TID251: layering, see banned-api below.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "T20", "D101", "D102", "D103", "TID251"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# Graph nodes, judges, ingestion and evals stay importable without the web
# layer, so they can run as Jobs and in tests without starting an app.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "Only copilot/api.py, copilot/routes/ and services/ may import FastAPI."
"starlette".msg = "Only copilot/api.py, copilot/routes/ and services/ may import Starlette."

[tool.ruff.lint.per-file-ignores]
"copilot/api.py" = ["TID251"]
"copilot/routes/**" = ["TID251"]
"services/**" = ["TID251"]
# Test names are full sentences; a docstring would repeat them.
"tests/**" = ["D101", "D102", "D103"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tools", "tests"]
