name: CI

on:
  push:
    # Branch pushes run tests + lint. Tag pushes additionally run `image`,
    # which is the only thing that publishes. See the `image` job below.
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Path filtering happens at job level: `paths-ignore` on the trigger would
  # also skip lint and leave required checks pending. Anything unclear
  # (tags, new branches, failed diff) counts as "everything changed".
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      web: ${{ steps.diff.outputs.web }}
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: diff
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          zero="0000000000000000000000000000000000000000"
          if [[ "$GITHUB_REF" == refs/tags/* ]] || [ -z "$base" ] \
              || [ "$base" = "$zero" ] \
              || ! git diff --name-only "$base" HEAD > /tmp/files.txt; then
            { echo "code=true"; echo "web=true"; echo "infra=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # grep exits 1 on no match, so test the filtered output rather
          # than grep's status.
          has() { [ -n "$(grep -E "$1" /tmp/files.txt || true)" ] && echo true || echo false; }
          code=$([ -n "$(grep -vE '^docs/|\.md$' /tmp/files.txt || true)" ] && echo true || echo false)
          # copilot/ counts for web: API changes must regenerate the TS client.
          web=$(has '^web/|^copilot/')
          infra=$(has '^deploy/')
          { echo "code=$code"; echo "web=$web"; echo "infra=$infra"; } >> "$GITHUB_OUTPUT"

  test-fast:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      # Unit tests with a fake LLM and fake judge: no DB, no API keys, no
      # network (pytest's defaults in pyproject.toml).
      - name: Run tests
        run: make test

  # Tags are in the condition because a skipped test-integration would also
  # skip `image`, which needs it.
  test-integration:
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v'))
    services:
      postgres:
        # Same major version + extension as the homelab and Azure databases.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot
      # Integration tests still use the fake LLM and judge; only the DB is real.
      LLM_PROVIDER: fake
      JUDGE: fake
      EMBED_DIM: "768"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run integration tests
        run: make test-integration

  web:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Regenerating the API types needs the Python app.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --group dev

      # prettier, lint, typecheck, build, and a diff check that the
      # committed TS client matches a fresh generation from the API.
      - name: Check web
        run: make check-web

  # Validates Terraform without touching any cloud: no credentials are
  # available to this job.
  infra:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4

      - name: Check infra
        run: make check-infra

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit-message steps below need history to walk base..HEAD.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install dependencies
        run: uv sync --group dev

      # prettier and terraform-fmt need Node / Terraform, which this job
      # doesn't install; the `web` and `infra` jobs run the same checks.
      # no-commit-to-branch would fail every push to main after a merge.
      - name: Run pre-commit hooks
        env:
          SKIP: prettier,terraform-fmt,no-commit-to-branch
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git rev-list "$base..HEAD" | while read -r sha; do
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            uv run python tools/check_commit_msg.py /tmp/commit-msg.txt
          done

      - name: Validate commit messages (push)
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          zero="0000000000000000000000000000000000000000"
          if [ "$before" != "$zero" ] && \
              git rev-list "$before..HEAD" > /tmp/shas.txt 2>/dev/null; then
            :
          else
            git rev-parse HEAD > /tmp/shas.txt
          fi
          while read -r sha; do
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            uv run python tools/check_commit_msg.py /tmp/commit-msg.txt
          done < /tmp/shas.txt

  # Commits are checked by the commit-msg rules above; a PR description
  # has no hook, so check it here. Same rule: no AI attribution lines.
  pr-description:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Reject AI attribution in the PR description
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -iqE \
              'generated with \[?claude code|co-authored-by:.*(claude|anthropic)|claude\.ai/code/session_'; then
            echo "::error::PR description contains an AI attribution line; remove it"
            exit 1
          fi

  # Publishes to GHCR, which the homelab pulls from. Pushing to ACR for the
  # Azure stage is added later as its own job with Azure credentials.
  image:
    runs-on: ubuntu-latest
    needs: [test-fast, test-integration, web, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - name: directive-copilot
            context: .
          # GLiNER2.5-Decide judge service (services/decision/).
          - name: directive-copilot-decision
            context: services/decision
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Derive the version and check it against pyproject.toml
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          project=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$project" ]; then
            echo "::error::tag v$tag does not match pyproject.toml version $project"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # Image names must be lowercase; owner names may not be.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # The default docker driver cannot export a cache: `cache-to` below
      # fails the job without this.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow's own token; no secret to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
